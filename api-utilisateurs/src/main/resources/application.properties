spring.application.name=healthtrack-utilisateurs
server.port=8081

# AWS DynamoDB (noms de tables en variables d'environnement en prod)
aws.region=${AWS_REGION:us-east-1}

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Swagger (utile en local uniquement)
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
# Swagger UI affiche le contrat OpenAPI rédigé (exemples + cas d'erreur), embarqué depuis docs/
springdoc.swagger-ui.url=/openapi-utilisateurs.yaml
springdoc.swagger-ui.disable-swagger-default-url=true

# Pas de datasource H2 en mode AWS
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
aws.dynamodb.endpoint=${DYNAMODB_ENDPOINT:}
