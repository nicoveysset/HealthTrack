spring.application.name=healthtrack-utilisateurs
server.port=8081

spring.datasource.url=jdbc:h2:mem:healthtrack-utilisateurs;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.h2.console.enabled=true

jwt.secret=${JWT_SECRET:healthtrack-default-secret-key-change-me-in-production-32}
jwt.expiration=86400000

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
