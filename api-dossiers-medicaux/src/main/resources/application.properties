spring.application.name=healthtrack-dossiers-medicaux
server.port=8083
spring.datasource.url=jdbc:h2:mem:healthtrack-dossiers;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
jwt.secret=${JWT_SECRET:healthtrack-default-secret-key-change-me-in-production-32}
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
