openapi: 3.0.3
info:
  title: HealthTrack — API Dossiers Médicaux
  version: 2.0.0
  description: |
    Dossier médical de chaque patient : groupe sanguin, antécédents, allergies et vaccinations.
    Le dossier d'un patient est identifié par **l'identifiant du patient** et créé automatiquement au premier accès.

    **Règles d'accès**
    - un patient accède uniquement à son propre dossier ;
    - un praticien accède au dossier d'un patient **seulement s'il l'a déjà reçu en consultation**
      (rendez-vous TERMINE, ou EN_COURS pour la consultation en cours) — sinon `AccessDeniedException`.

    **Traçabilité** : chaque création, modification et suppression est journalisée dans CloudWatch
    (événements JSON `ALLERGIE_CREATED`, `ALLERGIE_UPDATED`, `ALLERGIE_DELETED`, ...). La modification
    d'une allergie trace l'identité du praticien et les valeurs avant/après.

servers:
  - url: /
    description: Même hôte que cette page (API Gateway sur AWS, localhost:8083 en local)

tags:
  - name: Dossier
  - name: Antécédents
  - name: Allergies
  - name: Vaccinations

security:
  - bearerAuth: []

paths:
  /patients/{id}/dossier:
    parameters:
      - { $ref: '#/components/parameters/patientId' }
    get:
      tags: [Dossier]
      summary: Consulter le dossier médical complet d'un patient
      responses:
        '200':
          description: Dossier, antécédents, allergies et vaccinations
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DossierComplet' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AccessDenied' }
    patch:
      tags: [Dossier]
      summary: Modifier le groupe sanguin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DossierUpdate' }
            example: { groupeSanguin: "A+" }
      responses:
        '200':
          description: Dossier mis à jour
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DossierMedical' }
        '400':
          description: Groupe sanguin inconnu
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: ValidationException, message: "groupeSanguin invalide (valeurs possibles : [A+, A-, AB+, AB-, B+, B-, O+, O-])", statusCode: 400, path: /patients/ec64.../dossier, timestamp: "2026-11-26T10:00:00Z" }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AccessDenied' }

  /patients/{id}/antecedents:
    parameters:
      - { $ref: '#/components/parameters/patientId' }
    get:
      tags: [Antécédents]
      summary: Lister les antécédents (filtre optionnel par statut)
      parameters:
        - { name: statut, in: query, schema: { type: string, enum: [ACTIF, ARCHIVE] } }
      responses:
        '200':
          description: Antécédents (actifs d'abord, puis du plus récent au plus ancien)
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Antecedent' } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AccessDenied' }
    post:
      tags: [Antécédents]
      summary: Ajouter un antécédent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AntecedentRequest' }
            example: { libelle: Asthme, type: CHRONIQUE, date: "2010-05-01", description: "Traité par Ventoline à la demande" }
      responses:
        '201':
          description: Antécédent créé (statut ACTIF)
          headers:
            Location: { schema: { type: string }, description: "/antecedents/{antecedentId}" }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Antecedent' }
        '400':
          description: Type inconnu, libellé manquant, date future
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: ValidationException, message: "type invalide (valeurs possibles : [CHRONIQUE, PONCTUEL])", statusCode: 400, path: /patients/ec64.../antecedents, timestamp: "2026-11-26T10:00:00Z" }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AccessDenied' }

  /antecedents/{id}:
    patch:
      tags: [Antécédents]
      summary: Modifier ou archiver un antécédent
      description: |
        Modification partielle. `statut: ARCHIVE` archive l'antécédent ; un antécédent **CHRONIQUE**
        ne peut pas être archivé. `statut: ACTIF` réactive un antécédent archivé.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AntecedentUpdate' }
            examples:
              modifier: { summary: Modifier, value: { description: "Poignet gauche, plâtre 6 semaines" } }
              archiver: { summary: Archiver, value: { statut: ARCHIVE } }
      responses:
        '200':
          description: Antécédent mis à jour
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Antecedent' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AccessDenied' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Archivage d'un antécédent chronique
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: ChronicConditionCannotBeArchivedException, message: "L'antécédent chronique « Diabète de type 2 » ne peut pas être archivé", statusCode: 409, path: /antecedents/5c2e..., timestamp: "2026-11-26T10:00:00Z" }

  /patients/{id}/allergies:
    parameters:
      - { $ref: '#/components/parameters/patientId' }
    get:
      tags: [Allergies]
      summary: Lister les allergies d'un patient (utilisé lors de la prescription)
      responses:
        '200':
          description: Allergies
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Allergie' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AccessDenied' }
    post:
      tags: [Allergies]
      summary: Ajouter une allergie
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AllergieRequest' }
            example: { medicamentConcerne: Amoxicilline, severite: SEVERE, dateDecouverte: "2015-02-10" }
      responses:
        '201':
          description: Allergie créée
          headers:
            Location: { schema: { type: string }, description: "/allergies/{allergieId}" }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Allergie' }
        '400':
          description: Sévérité inconnue, date future
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: ValidationException, message: "severite invalide (valeurs possibles : [LEGERE, MODEREE, SEVERE])", statusCode: 400, path: /patients/ec64.../allergies, timestamp: "2026-11-26T10:00:00Z" }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AccessDenied' }
        '409':
          description: Allergie déjà enregistrée pour ce médicament
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: ConflictException, message: "Une allergie à « Amoxicilline » est déjà enregistrée pour ce patient", statusCode: 409, path: /patients/ec64.../allergies, timestamp: "2026-11-26T10:00:00Z" }

  /allergies/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [Allergies]
      summary: Modifier une allergie (tracé dans CloudWatch avec l'identité du praticien)
      description: |
        Chaque modification produit le log CloudWatch :
        `{"event":"ALLERGIE_UPDATED","allergieId":"…","patientId":"…","praticienId":"…","praticienNom":"Claire Martin","modifiedByType":"PRATICIEN","avant":"{severite=SEVERE}","apres":"{severite=MODEREE}"}`
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AllergieUpdate' }
            example: { severite: MODEREE }
      responses:
        '200':
          description: Allergie mise à jour
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Allergie' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AccessDenied' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Allergies]
      summary: Supprimer une allergie
      description: Interdit si une ordonnance **ACTIVE** du patient prescrit ce médicament (nom ou substance active).
      responses:
        '204': { description: Supprimée }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AccessDenied' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Allergie liée à une ordonnance active
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: AllergyLinkedToActivePrescriptionException, message: "L'allergie à « Paracétamol » est liée à une ordonnance active et ne peut pas être supprimée", statusCode: 409, path: /allergies/a486..., timestamp: "2026-11-26T10:00:00Z" }

  /patients/{id}/vaccinations:
    parameters:
      - { $ref: '#/components/parameters/patientId' }
    get:
      tags: [Vaccinations]
      summary: Lister les vaccinations
      responses:
        '200':
          description: Vaccinations
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Vaccination' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AccessDenied' }
    post:
      tags: [Vaccinations]
      summary: Ajouter une vaccination
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VaccinationRequest' }
            example: { nomVaccin: DTP, date: "2024-01-15", rappelPrevu: "2044-01-15" }
      responses:
        '201':
          description: Vaccination enregistrée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vaccination' }
        '400':
          description: Date future ou rappel antérieur à la vaccination
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: ValidationException, message: "rappelPrevu doit être postérieur à la date de vaccination", statusCode: 400, path: /patients/ec64.../vaccinations, timestamp: "2026-11-26T10:00:00Z" }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AccessDenied' }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }

  parameters:
    patientId:
      name: id
      in: path
      required: true
      description: Identifiant du patient (= identifiant du dossier)
      schema: { type: string, format: uuid }

  responses:
    ValidationError:
      description: Requête invalide
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: ValidationException, message: "dateDecouverte ne peut pas être dans le futur", statusCode: 400, path: /allergies/a486..., timestamp: "2026-11-26T10:00:00Z" }
    Unauthorized:
      description: Token JWT manquant, expiré ou invalide
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: UnauthorizedException, message: "Token JWT manquant ou invalide", statusCode: 401, path: /patients/ec64.../dossier, timestamp: "2026-11-26T10:00:00Z" }
    AccessDenied:
      description: |
        Praticien sans consultation antérieure avec ce patient (`AccessDeniedException`),
        ou patient tentant d'accéder au dossier d'un autre patient (`ForbiddenException`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            AccessDenied:
              summary: Praticien sans consultation antérieure
              value: { error: AccessDeniedException, message: "Accès refusé : vous n'avez aucune consultation antérieure avec ce patient", statusCode: 403, path: /patients/ec64.../dossier, timestamp: "2026-11-26T10:00:00Z" }
            Forbidden:
              summary: Autre patient
              value: { error: ForbiddenException, message: "Un patient ne peut consulter que son propre dossier", statusCode: 403, path: /patients/ec64.../dossier, timestamp: "2026-11-26T10:00:00Z" }
    NotFound:
      description: Ressource introuvable
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: NotFoundException, message: "Allergie a486... non trouvée", statusCode: 404, path: /allergies/a486..., timestamp: "2026-11-26T10:00:00Z" }

  schemas:
    Error:
      type: object
      properties:
        error: { type: string, description: Nom de l'exception métier }
        message: { type: string }
        statusCode: { type: integer }
        path: { type: string }
        timestamp: { type: string, format: date-time }
    DossierMedical:
      type: object
      properties:
        patientId: { type: string, format: uuid }
        groupeSanguin: { type: string, enum: ["", "A+", "A-", "B+", "B-", "AB+", "AB-", "O+", "O-"] }
        dateCreation: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    DossierUpdate:
      type: object
      properties:
        groupeSanguin: { type: string, example: "A+" }
    DossierComplet:
      type: object
      properties:
        dossier: { $ref: '#/components/schemas/DossierMedical' }
        antecedents: { type: array, items: { $ref: '#/components/schemas/Antecedent' } }
        allergies: { type: array, items: { $ref: '#/components/schemas/Allergie' } }
        vaccinations: { type: array, items: { $ref: '#/components/schemas/Vaccination' } }
    AntecedentRequest:
      type: object
      required: [libelle, type]
      properties:
        libelle: { type: string }
        type: { type: string, enum: [CHRONIQUE, PONCTUEL] }
        date: { type: string, format: date, description: "Défaut : aujourd'hui" }
        description: { type: string }
    AntecedentUpdate:
      type: object
      properties:
        libelle: { type: string }
        type: { type: string, enum: [CHRONIQUE, PONCTUEL] }
        date: { type: string, format: date }
        description: { type: string }
        statut: { type: string, enum: [ACTIF, ARCHIVE] }
    Antecedent:
      type: object
      properties:
        antecedentId: { type: string, format: uuid }
        dossierId: { type: string, format: uuid }
        libelle: { type: string, example: Asthme }
        type: { type: string, enum: [CHRONIQUE, PONCTUEL] }
        date: { type: string, format: date }
        statut: { type: string, enum: [ACTIF, ARCHIVE] }
        description: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AllergieRequest:
      type: object
      required: [medicamentConcerne, severite]
      properties:
        medicamentConcerne: { type: string, description: Nom du médicament ou de la substance active }
        severite: { type: string, enum: [LEGERE, MODEREE, SEVERE] }
        dateDecouverte: { type: string, format: date, description: "Défaut : aujourd'hui" }
        description: { type: string }
    AllergieUpdate:
      type: object
      properties:
        medicamentConcerne: { type: string }
        severite: { type: string, enum: [LEGERE, MODEREE, SEVERE] }
        dateDecouverte: { type: string, format: date }
        description: { type: string }
    Allergie:
      type: object
      properties:
        allergieId: { type: string, format: uuid }
        patientId: { type: string, format: uuid }
        medicamentConcerne: { type: string, example: Amoxicilline }
        severite: { type: string, enum: [LEGERE, MODEREE, SEVERE] }
        dateDecouverte: { type: string, format: date }
        description: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    VaccinationRequest:
      type: object
      required: [nomVaccin, date]
      properties:
        nomVaccin: { type: string }
        date: { type: string, format: date }
        rappelPrevu: { type: string, format: date }
        description: { type: string }
    Vaccination:
      type: object
      properties:
        vaccinationId: { type: string, format: uuid }
        dossierId: { type: string, format: uuid }
        nomVaccin: { type: string, example: DTP }
        date: { type: string, format: date }
        rappelPrevu: { type: string, format: date, nullable: true }
        description: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
