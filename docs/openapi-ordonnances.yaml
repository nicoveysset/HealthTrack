openapi: 3.0.3
info:
  title: HealthTrack API - Ordonnances & Médicaments
  description: |
    API de gestion des ordonnances et médicaments pour l'application HealthTrack.
    
    Cette API permet la création et gestion des ordonnances, des lignes de prescription,
    et la gestion des médicaments.
  version: 1.0.0
  contact:
    name: HealthTrack Team
    email: contact@healthtrack.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: https://api.healthtrack.com/ordonnances
    description: Production server
  - url: https://staging-api.healthtrack.com/ordonnances
    description: Staging server
  - url: http://localhost:3000/ordonnances
    description: Development server

tags:
  - name: Ordonnances
    description: Gestion des ordonnances
  - name: Lignes de Prescription
    description: Gestion des lignes de prescription
  - name: Médicaments
    description: Gestion des médicaments

security:
  - bearerAuth: []

paths:
  /ordonnances:
    post:
      tags:
        - Ordonnances
      summary: Créer une nouvelle ordonnance
      description: |
        Crée une nouvelle ordonnance basée sur un compte rendu finalisé.
        Seul le praticien qui a rédigé le compte rendu peut créer une ordonnance.
      operationId: createOrdonnance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrdonnanceInput'
      responses:
        '201':
          description: Ordonnance créée avec succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ordonnance'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Le compte appelant n'est pas le praticien du compte rendu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                forbidden:
                  value:
                    error: "ForbiddenException"
                    message: "Seul le praticien du compte rendu peut créer l'ordonnance"
                    statusCode: 403
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Conflit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          examples:
            notFinalized:
              value:
                error: "ConsultationNotFinalizedException"
                message: "Le compte rendu n'est pas finalisé"
                statusCode: 409
        '500':
          $ref: '#/components/responses/InternalServerError'

    get:
      tags:
        - Ordonnances
      summary: Lister les ordonnances
      description: |
        Liste les ordonnances avec pagination et filtrage.
        - Les patients voient seulement leurs propres ordonnances
        - Les praticiens voient toutes les ordonnances (ou filtrées par patient)
      operationId: listOrdonnances
      parameters:
        - name: patientId
          in: query
          description: Filtrer par ID du patient
          required: false
          schema:
            type: string
            format: uuid
        - name: statut
          in: query
          description: Filtrer par statut
          required: false
          schema:
            type: string
            enum: [ACTIVE, EXPIREE]
        - name: dateDebut
          in: query
          description: Filtrer par date de début
          required: false
          schema:
            type: string
            format: date
        - name: dateFin
          in: query
          description: Filtrer par date de fin
          required: false
          schema:
            type: string
            format: date
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: Liste des ordonnances
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrdonnanceList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /ordonnances/{ordonnanceId}:
    get:
      tags:
        - Ordonnances
      summary: Obtenir une ordonnance
      description: |
        Retourne une ordonnance avec ses lignes de prescription.
        Seuls le patient ou le praticien concerné peuvent accéder à l'ordonnance.
      operationId: getOrdonnanceById
      parameters:
        - $ref: '#/components/parameters/ordonnanceId'
      responses:
        '200':
          description: Ordonnance avec ses lignes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrdonnanceAvecLignes'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /ordonnances/{ordonnanceId}/lignes:
    post:
      tags:
        - Lignes de Prescription
      summary: Ajouter une ligne à une ordonnance
      description: |
        Ajoute une nouvelle ligne de prescription à une ordonnance.
        Seul le praticien qui a créé l'ordonnance peut ajouter des lignes.
        L'ordonnance ne doit pas être expirée.
      operationId: createLignePrescription
      parameters:
        - $ref: '#/components/parameters/ordonnanceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LignePrescriptionInput'
      responses:
        '201':
          description: Ligne de prescription créée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LignePrescription'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Conflit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          examples:
            expired:
              value:
                error: "PrescriptionExpiredException"
                message: "L'ordonnance est expirée"
                statusCode: 409
            allergy:
              value:
                error: "AllergyConflictException"
                message: "Conflit avec une allergie du patient"
                statusCode: 409
        '500':
          $ref: '#/components/responses/InternalServerError'

    get:
      tags:
        - Lignes de Prescription
      summary: Lister les lignes d'une ordonnance
      description: |
        Retourne la liste des lignes de prescription d'une ordonnance.
        Seuls le patient ou le praticien concerné peuvent accéder aux lignes.
      operationId: listLignesPrescription
      parameters:
        - $ref: '#/components/parameters/ordonnanceId'
      responses:
        '200':
          description: Liste des lignes de prescription
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LignePrescription'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags:
        - Lignes de Prescription
      summary: Supprimer une ligne d'une ordonnance
      description: |
        Supprime une ligne de prescription d'une ordonnance.
        Seul le praticien qui a créé l'ordonnance peut supprimer des lignes.
      operationId: deleteLignePrescription
      parameters:
        - $ref: '#/components/parameters/ordonnanceId'
        - name: ligneId
          in: path
          required: true
          description: ID de la ligne de prescription
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Ligne supprimée avec succès
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /medicaments:
    get:
      tags:
        - Médicaments
      summary: Lister les médicaments
      description: |
        Retourne la liste des médicaments avec pagination et filtrage.
        Accessible à tous les utilisateurs authentifiés.
      operationId: listMedicaments
      parameters:
        - name: forme
          in: query
          description: Filtrer par forme de médicament
          required: false
          schema:
            type: string
            enum: [COMPRIME, SIROP, INJECTION, AUTRE]
        - name: search
          in: query
          description: Recherche par nom ou substance active
          required: false
          schema:
            type: string
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: Liste des médicaments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedicamentList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags:
        - Médicaments
      summary: Créer un nouveau médicament
      description: |
        Crée un nouveau médicament dans la base de données.
        Réservé aux administrateurs uniquement.
      operationId: createMedicament
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MedicamentInput'
      responses:
        '201':
          description: Médicament créé avec succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Medicament'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token JWT pour l'authentification

  schemas:
    Ordonnance:
      type: object
      properties:
        ordonnanceId:
          type: string
          format: uuid
          example: "ordonnance-uuid-1234"
          description: ID unique de l'ordonnance
        compteRenduId:
          type: string
          format: uuid
          example: "compte-rendu-uuid-1234"
          description: ID du compte rendu associé
        patientId:
          type: string
          format: uuid
          example: "patient-uuid-1234"
          description: ID du patient
        praticienId:
          type: string
          format: uuid
          example: "praticien-uuid-1234"
          description: ID du praticien
        dateEmission:
          type: string
          format: date-time
          example: "2023-11-25T10:00:00Z"
          description: Date d'émission de l'ordonnance
        dateValidite:
          type: string
          format: date-time
          example: "2024-02-25T00:00:00Z"
          description: Date de validité de l'ordonnance (par défaut 3 mois)
        statut:
          type: string
          enum: [ACTIVE, EXPIREE]
          example: "ACTIVE"
          description: Statut de l'ordonnance
        createdAt:
          type: string
          format: date-time
          example: "2023-11-25T10:00:00Z"
        updatedAt:
          type: string
          format: date-time
          example: "2023-11-25T10:00:00Z"

    OrdonnanceAvecLignes:
      type: object
      allOf:
        - $ref: '#/components/schemas/Ordonnance'
        - type: object
          properties:
            lignes:
              type: array
              items:
                $ref: '#/components/schemas/LignePrescription'

    OrdonnanceInput:
      type: object
      required:
        - compteRenduId
      properties:
        compteRenduId:
          type: string
          format: uuid
          example: "compte-rendu-uuid-1234"
          description: ID du compte rendu finalisé

    OrdonnanceList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Ordonnance'
        count:
          type: integer
          example: 10
          description: Nombre total d'ordonnances
        page:
          type: integer
          example: 1
          description: Numéro de la page
        limit:
          type: integer
          example: 10
          description: Nombre d'éléments par page

    LignePrescription:
      type: object
      properties:
        ligneId:
          type: string
          format: uuid
          example: "ligne-uuid-1234"
          description: ID unique de la ligne
        ordonnanceId:
          type: string
          format: uuid
          example: "ordonnance-uuid-1234"
          description: ID de l'ordonnance
        medicamentId:
          type: string
          format: uuid
          example: "medicament-uuid-1234"
          description: ID du médicament
        posologie:
          type: string
          maxLength: 200
          example: "1 comprimé par jour"
          description: Posologie du médicament
        duree:
          type: integer
          minimum: 0
          maximum: 90
          example: 30
          description: Durée du traitement en jours (max 90 jours)
        instructions:
          type: string
          maxLength: 500
          example: "À prendre le matin à jeun"
          description: Instructions spéciales
        createdAt:
          type: string
          format: date-time
          example: "2023-11-25T10:00:00Z"
        updatedAt:
          type: string
          format: date-time
          example: "2023-11-25T10:00:00Z"

    LignePrescriptionInput:
      type: object
      required:
        - medicamentId
        - posologie
      properties:
        medicamentId:
          type: string
          format: uuid
          example: "medicament-uuid-1234"
        posologie:
          type: string
          maxLength: 200
          example: "1 comprimé par jour"
        duree:
          type: integer
          minimum: 1
          maximum: 90
          example: 30
        instructions:
          type: string
          maxLength: 500
          example: "À prendre le matin à jeun"

    Medicament:
      type: object
      properties:
        medicamentId:
          type: string
          format: uuid
          example: "medicament-uuid-1234"
          description: ID unique du médicament
        nom:
          type: string
          maxLength: 200
          example: "Paracétamol 500mg"
          description: Nom du médicament
        substanceActive:
          type: string
          maxLength: 200
          example: "Paracétamol"
          description: Substance active principale
        forme:
          type: string
          enum: [COMPRIME, SIROP, INJECTION, AUTRE]
          example: "COMPRIME"
          description: Forme du médicament
        description:
          type: string
          maxLength: 1000
          example: "Antalgique et antipyrétique"
          description: Description du médicament
        createdAt:
          type: string
          format: date-time
          example: "2023-11-25T10:00:00Z"
        updatedAt:
          type: string
          format: date-time
          example: "2023-11-25T10:00:00Z"

    MedicamentInput:
      type: object
      required:
        - nom
      properties:
        nom:
          type: string
          maxLength: 200
          example: "Paracétamol 500mg"
        substanceActive:
          type: string
          maxLength: 200
          example: "Paracétamol"
        forme:
          type: string
          enum: [COMPRIME, SIROP, INJECTION, AUTRE]
          default: AUTRE
          example: "COMPRIME"
        description:
          type: string
          maxLength: 1000
          example: "Antalgique et antipyrétique"

    MedicamentList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Medicament'
        count:
          type: integer
          example: 100
          description: Nombre total de médicaments
        page:
          type: integer
          example: 1
          description: Numéro de la page
        limit:
          type: integer
          example: 10
          description: Nombre d'éléments par page

    Error:
      type: object
      required:
        - error
        - message
        - statusCode
      properties:
        error:
          type: string
          example: "NotFound"
        message:
          type: string
          example: "Ressource non trouvée"
        statusCode:
          type: integer
          example: 404

  responses:
    BadRequest:
      description: Requête invalide
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Unauthorized:
      description: Non autorisé
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Forbidden:
      description: Accès interdit
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    NotFound:
      description: Ressource non trouvée
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    InternalServerError:
      description: Erreur interne du serveur
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  parameters:
    ordonnanceId:
      name: ordonnanceId
      in: path
      required: true
      description: ID de l'ordonnance
      schema:
        type: string
        format: uuid

    page:
      name: page
      in: query
      description: Numéro de la page
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1

    limit:
      name: limit
      in: query
      description: Nombre d'éléments par page
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
