openapi: 3.0.3
info:
  title: HealthTrack — API Ordonnances
  version: 2.0.0
  description: |
    Ordonnances émises à l'issue d'une consultation, lignes de prescription et référentiel de médicaments.

    **Création** : sur un rendez-vous **TERMINE** dont le compte rendu est **finalisé**, uniquement par le praticien
    qui a réalisé la consultation. Validité : 3 mois. Une ordonnance dont la date de validité est dépassée passe
    automatiquement au statut EXPIREE et n'est plus modifiable.

    **Alertes CloudWatch** (namespace `HealthTrack/Ordonnances`, format Embedded Metric Format) :
    - `AllergyConflict` : tentative de prescription d'un médicament auquel le patient est allergique ;
    - `PrescriptionLongueDuree` : ligne de prescription de plus de 90 jours (la ligne est acceptée).

servers:
  - url: /
    description: Même hôte que cette page (API Gateway sur AWS, localhost:8084 en local)

tags:
  - name: Ordonnances
  - name: Lignes de prescription
  - name: Médicaments

security:
  - bearerAuth: []

paths:
  /ordonnances:
    post:
      tags: [Ordonnances]
      summary: Créer une ordonnance sur un rendez-vous
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrdonnanceRequest' }
            example: { rdvId: "8a1f2c3d-0000-4000-8000-000000000001" }
      responses:
        '201':
          description: Ordonnance créée (ACTIVE, valable 3 mois)
          headers:
            Location: { schema: { type: string }, description: "/ordonnances/{ordonnanceId}" }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ordonnance' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: L'appelant n'est pas le praticien ayant réalisé la consultation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: ForbiddenException, message: "Seul le praticien ayant réalisé la consultation peut créer l'ordonnance", statusCode: 403, path: /ordonnances, timestamp: "2026-11-26T10:00:00Z" }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Consultation non terminée / compte rendu non finalisé, ou ordonnance déjà émise
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                NotTermine:
                  summary: Rendez-vous non TERMINE
                  value: { error: ConsultationNotFinalizedException, message: "Le rendez-vous doit être TERMINE pour émettre une ordonnance (statut actuel : CONFIRME)", statusCode: 409, path: /ordonnances, timestamp: "2026-11-26T10:00:00Z" }
                CrNonFinalise:
                  summary: Compte rendu non finalisé
                  value: { error: ConsultationNotFinalizedException, message: "Le compte rendu de la consultation doit être finalisé avant l'ordonnance", statusCode: 409, path: /ordonnances, timestamp: "2026-11-26T10:00:00Z" }
                Doublon:
                  summary: Ordonnance déjà émise
                  value: { error: ConflictException, message: "Une ordonnance existe déjà pour ce rendez-vous", statusCode: 409, path: /ordonnances, timestamp: "2026-11-26T10:00:00Z" }
    get:
      tags: [Ordonnances]
      summary: Lister des ordonnances (paginé, filtrable)
      description: |
        - **Patient** : ses propres ordonnances.
        - **Praticien** : les ordonnances qu'il a émises, ou celles d'un patient (`patientId`) s'il l'a déjà reçu en consultation.
      parameters:
        - { name: patientId, in: query, schema: { type: string, format: uuid } }
        - { name: rdvId, in: query, schema: { type: string, format: uuid } }
        - { name: statut, in: query, schema: { type: string, enum: [ACTIVE, EXPIREE] } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 10 } }
      responses:
        '200':
          description: Page d'ordonnances (plus récentes d'abord)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/Ordonnance' } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Patient jamais consulté par ce praticien, ou patient demandant les ordonnances d'un autre
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: AccessDeniedException, message: "Accès refusé : aucune consultation antérieure avec ce patient", statusCode: 403, path: /ordonnances, timestamp: "2026-11-26T10:00:00Z" }

  /ordonnances/{id}:
    get:
      tags: [Ordonnances]
      summary: Détail d'une ordonnance avec ses lignes
      parameters:
        - { $ref: '#/components/parameters/ordonnanceId' }
      responses:
        '200':
          description: Ordonnance et lignes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrdonnanceAvecLignes' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /ordonnances/{id}/lignes:
    parameters:
      - { $ref: '#/components/parameters/ordonnanceId' }
    get:
      tags: [Lignes de prescription]
      summary: Lignes de prescription d'une ordonnance
      responses:
        '200':
          description: Lignes
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/LignePrescription' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Lignes de prescription]
      summary: Ajouter une ligne de prescription
      description: |
        Refusé si le patient est allergique au médicament (comparaison sur le nom et la substance active,
        accents et casse ignorés : une allergie « Amoxicilline » bloque aussi « Augmentin »).
        Une durée de plus de 90 jours est acceptée mais déclenche une alerte métier CloudWatch.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LigneRequest' }
            examples:
              normale: { summary: Ligne standard, value: { medicamentId: "3d1c...", posologie: "1 g toutes les 6h si douleur", duree: 5, instructions: "Ne pas dépasser 4 g par jour" } }
              longue: { summary: "Plus de 90 jours (alerte CloudWatch)", value: { medicamentId: "7b2a...", posologie: "1 sachet par jour", duree: 120 } }
      responses:
        '201':
          description: Ligne ajoutée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LignePrescription' }
        '400':
          description: Durée < 1 jour, posologie manquante
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: ValidationException, message: "duree : doit être d'au moins 1 jour", statusCode: 400, path: /ordonnances/o1/lignes, timestamp: "2026-11-26T10:00:00Z" }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NotAuthor' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Allergie connue ou ordonnance expirée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                AllergyConflict:
                  summary: Allergie connue (loggée dans CloudWatch)
                  value: { error: AllergyConflictException, message: "Le patient est allergique à Augmentin (Amoxicilline + acide clavulanique)", statusCode: 409, path: /ordonnances/o1/lignes, timestamp: "2026-11-26T10:00:00Z" }
                Expired:
                  summary: Ordonnance expirée
                  value: { error: PrescriptionExpiredException, message: "L'ordonnance a expiré le 2026-10-01 et ne peut plus être modifiée", statusCode: 409, path: /ordonnances/o1/lignes, timestamp: "2026-11-26T10:00:00Z" }

  /ordonnances/{id}/lignes/{ligneId}:
    delete:
      tags: [Lignes de prescription]
      summary: Retirer une ligne de prescription
      parameters:
        - { $ref: '#/components/parameters/ordonnanceId' }
        - { name: ligneId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Ligne retirée }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NotAuthor' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Ordonnance expirée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: PrescriptionExpiredException, message: "L'ordonnance a expiré le 2026-10-01 et ne peut plus être modifiée", statusCode: 409, path: /ordonnances/o1/lignes/l1, timestamp: "2026-11-26T10:00:00Z" }

  /medicaments:
    get:
      tags: [Médicaments]
      summary: Lister les médicaments disponibles (paginé, filtrable)
      parameters:
        - { name: forme, in: query, schema: { $ref: '#/components/schemas/Forme' } }
        - { name: search, in: query, description: Recherche dans le nom et la substance active, schema: { type: string }, example: amox }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Page de médicaments triés par nom
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/Medicament' } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Médicaments]
      summary: Ajouter un médicament au référentiel (praticien)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MedicamentRequest' }
            example: { nom: "Spasfon 80 mg", substanceActive: Phloroglucinol, forme: COMPRIME, description: Antispasmodique }
      responses:
        '201':
          description: Médicament créé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Medicament' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Nom déjà présent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: ConflictException, message: "Le médicament « Doliprane 1000 mg » existe déjà", statusCode: 409, path: /medicaments, timestamp: "2026-11-26T10:00:00Z" }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }

  parameters:
    ordonnanceId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    ValidationError:
      description: Requête invalide
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: ValidationException, message: "forme invalide (valeurs possibles : [COMPRIME, SIROP, INJECTION, AUTRE])", statusCode: 400, path: /medicaments, timestamp: "2026-11-26T10:00:00Z" }
    Unauthorized:
      description: Token JWT manquant, expiré ou invalide
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: UnauthorizedException, message: "Token JWT manquant ou invalide", statusCode: 401, path: /ordonnances, timestamp: "2026-11-26T10:00:00Z" }
    Forbidden:
      description: Accès non autorisé
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: ForbiddenException, message: "Vous n'avez pas accès à cette ordonnance", statusCode: 403, path: /ordonnances/o1, timestamp: "2026-11-26T10:00:00Z" }
    NotAuthor:
      description: Seul le praticien auteur peut modifier l'ordonnance
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: ForbiddenException, message: "Seul le praticien auteur de l'ordonnance peut la modifier", statusCode: 403, path: /ordonnances/o1/lignes, timestamp: "2026-11-26T10:00:00Z" }
    NotFound:
      description: Ressource introuvable
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: NotFoundException, message: "Ordonnance o1 non trouvée", statusCode: 404, path: /ordonnances/o1, timestamp: "2026-11-26T10:00:00Z" }

  schemas:
    Error:
      type: object
      properties:
        error: { type: string, description: Nom de l'exception métier }
        message: { type: string }
        statusCode: { type: integer }
        path: { type: string }
        timestamp: { type: string, format: date-time }
    Page:
      type: object
      properties:
        count: { type: integer, description: Nombre total d'éléments }
        page: { type: integer }
        limit: { type: integer }
    Forme:
      type: string
      enum: [COMPRIME, SIROP, INJECTION, AUTRE]
    OrdonnanceRequest:
      type: object
      required: [rdvId]
      properties:
        rdvId: { type: string, format: uuid, description: Rendez-vous TERMINE dont le compte rendu est finalisé }
    Ordonnance:
      type: object
      properties:
        ordonnanceId: { type: string, format: uuid }
        rdvId: { type: string, format: uuid }
        compteRenduId: { type: string, format: uuid }
        patientId: { type: string, format: uuid }
        patientNom: { type: string }
        praticienId: { type: string, format: uuid }
        praticienNom: { type: string }
        dateEmission: { type: string, format: date-time }
        dateValidite: { type: string, example: "2027-02-26T23:59:59", description: "Émission + 3 mois" }
        statut: { type: string, enum: [ACTIVE, EXPIREE] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    OrdonnanceAvecLignes:
      type: object
      properties:
        ordonnance: { $ref: '#/components/schemas/Ordonnance' }
        lignes: { type: array, items: { $ref: '#/components/schemas/LignePrescription' } }
    LigneRequest:
      type: object
      required: [medicamentId, posologie, duree]
      properties:
        medicamentId: { type: string, format: uuid }
        posologie: { type: string }
        duree: { type: integer, minimum: 1, description: Durée du traitement en jours }
        instructions: { type: string }
    LignePrescription:
      type: object
      properties:
        ordonnanceId: { type: string, format: uuid }
        ligneId: { type: string, format: uuid }
        medicamentId: { type: string, format: uuid }
        medicamentNom: { type: string, example: Doliprane 1000 mg }
        posologie: { type: string, example: "1 g toutes les 6h si douleur" }
        duree: { type: integer, example: 5 }
        instructions: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    MedicamentRequest:
      type: object
      required: [nom, forme]
      properties:
        nom: { type: string }
        substanceActive: { type: string }
        forme: { $ref: '#/components/schemas/Forme' }
        description: { type: string }
    Medicament:
      type: object
      properties:
        medicamentId: { type: string, format: uuid }
        nom: { type: string, example: Doliprane 1000 mg }
        substanceActive: { type: string, example: Paracetamol }
        forme: { $ref: '#/components/schemas/Forme' }
        description: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
