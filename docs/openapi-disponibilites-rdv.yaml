openapi: 3.0.3
info:
  title: HealthTrack — API Disponibilités et Rendez-vous
  version: 2.0.0
  description: |
    Disponibilités hebdomadaires et indisponibilités ponctuelles des praticiens, calcul des créneaux libres,
    prise et cycle de vie des rendez-vous, comptes rendus de consultation.

    **Authentification** : token JWT obtenu sur l'API Utilisateurs (`POST /auth/login`), bouton **Authorize**.

    **Heures** : toutes les dates/heures sont exprimées dans le fuseau du cabinet (**Europe/Paris**),
    même si la Lambda s'exécute en UTC.

    **Cycle de vie d'un rendez-vous**
    ```
    PLANIFIE ──► CONFIRME ──► EN_COURS ──► TERMINE
       │            │
       ├──► ANNULE ◄┤   (patient ou praticien, au plus tard 2h avant)
       └──► NON_VENU◄┘  (praticien, après l'heure du rendez-vous)
    ```
    EN_COURS, TERMINE et NON_VENU sont réservés au praticien du rendez-vous.

servers:
  - url: /
    description: Même hôte que cette page (API Gateway sur AWS, localhost:8082 en local)

tags:
  - name: Disponibilités
  - name: Indisponibilités
  - name: Créneaux
  - name: Rendez-vous
  - name: Comptes rendus

security:
  - bearerAuth: []

paths:
  /praticiens/me/disponibilites:
    put:
      tags: [Disponibilités]
      summary: Définir / modifier mes disponibilités hebdomadaires (praticien)
      description: |
        Remplace l'ensemble des disponibilités récurrentes du praticien connecté.
        Deux plages du même jour ne peuvent pas se chevaucher.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DisponibilitesRequest' }
            example:
              disponibilites:
                - { jourSemaine: LUNDI, heureDebut: "09:00", heureFin: "12:00" }
                - { jourSemaine: LUNDI, heureDebut: "14:00", heureFin: "18:00" }
                - { jourSemaine: MERCREDI, heureDebut: "09:00", heureFin: "12:00" }
      responses:
        '200':
          description: Nouvelles disponibilités, triées par jour puis heure
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Disponibilite' } }
        '400':
          description: Jour ou heure invalide, heure de fin avant l'heure de début
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: ValidationException, message: "heureFin doit être après heureDebut (LUNDI)", statusCode: 400, path: /praticiens/me/disponibilites, timestamp: "2026-11-26T10:00:00Z" }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/PraticienOnly' }
        '409':
          description: Deux plages du même jour se chevauchent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: SlotOverlapException, message: "Les créneaux 09:00-12:00 et 11:00-13:00 du LUNDI se chevauchent", statusCode: 409, path: /praticiens/me/disponibilites, timestamp: "2026-11-26T10:00:00Z" }
    get:
      tags: [Disponibilités]
      summary: Mes disponibilités (praticien)
      responses:
        '200':
          description: Disponibilités du praticien connecté
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Disponibilite' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/PraticienOnly' }

  /praticiens/{id}/disponibilites:
    get:
      tags: [Disponibilités]
      summary: Disponibilités hebdomadaires d'un praticien
      parameters:
        - { $ref: '#/components/parameters/praticienId' }
      responses:
        '200':
          description: Disponibilités récurrentes
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Disponibilite' } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /praticiens/me/indisponibilites:
    post:
      tags: [Indisponibilités]
      summary: Déclarer une indisponibilité ponctuelle (praticien)
      description: |
        `dateDebut` / `dateFin` acceptent `YYYY-MM-DD` (journée entière) ou `YYYY-MM-DDTHH:MM` (heure de Paris).
        Aucun rendez-vous ne pourra être pris sur la période (`PractitionerUnavailableException`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IndisponibiliteRequest' }
            example: { dateDebut: "2026-12-01T14:00", dateFin: "2026-12-01T18:00", motif: Formation }
      responses:
        '201':
          description: Indisponibilité créée
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Indisponibilite' }
        '400':
          description: Date invalide ou fin avant début
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: ValidationException, message: "dateFin doit être postérieure à dateDebut", statusCode: 400, path: /praticiens/me/indisponibilites, timestamp: "2026-11-26T10:00:00Z" }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/PraticienOnly' }
        '422':
          description: Période entièrement passée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: PastDateException, message: "L'indisponibilité se termine dans le passé", statusCode: 422, path: /praticiens/me/indisponibilites, timestamp: "2026-11-26T10:00:00Z" }
    get:
      tags: [Indisponibilités]
      summary: Mes indisponibilités (praticien)
      responses:
        '200':
          description: Indisponibilités triées par date de début
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Indisponibilite' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/PraticienOnly' }

  /praticiens/me/indisponibilites/{id}:
    delete:
      tags: [Indisponibilités]
      summary: Supprimer une de mes indisponibilités
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Supprimée }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: L'indisponibilité appartient à un autre praticien
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: ForbiddenException, message: "Cette indisponibilité appartient à un autre praticien", statusCode: 403, path: /praticiens/me/indisponibilites/4f1c..., timestamp: "2026-11-26T10:00:00Z" }
        '404': { $ref: '#/components/responses/NotFound' }

  /praticiens/{id}/creneaux:
    get:
      tags: [Créneaux]
      summary: Créneaux libres d'un praticien sur une période
      description: |
        Créneaux de 30 minutes calculés à partir des disponibilités hebdomadaires, en excluant
        les créneaux passés, les indisponibilités ponctuelles et les rendez-vous non annulés. Période de 62 jours maximum.
      parameters:
        - { $ref: '#/components/parameters/praticienId' }
        - { name: dateDebut, in: query, required: true, schema: { type: string, format: date }, example: "2026-11-30" }
        - { name: dateFin, in: query, required: true, schema: { type: string, format: date }, example: "2026-12-04" }
      responses:
        '200':
          description: Créneaux libres
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Creneau' } }
              example:
                - { date: "2026-11-30", heure: "09:00", duree: 30 }
                - { date: "2026-11-30", heure: "09:30", duree: 30 }
        '400':
          description: Dates manquantes, invalides ou période trop longue
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: ValidationException, message: "La période ne peut pas dépasser 62 jours", statusCode: 400, path: /praticiens/x/creneaux, timestamp: "2026-11-26T10:00:00Z" }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/PractitionerNotAvailable' }

  /rendezvous:
    post:
      tags: [Rendez-vous]
      summary: Prendre un rendez-vous
      description: |
        Un **patient** réserve pour lui-même. Un **praticien** peut créer un rendez-vous dans son propre agenda
        en précisant `patientId`. Le rendez-vous est créé au statut PLANIFIE.

        Vérifications, dans l'ordre : date future → praticien ACTIF → pas d'indisponibilité ponctuelle →
        dans les disponibilités hebdomadaires → créneau libre.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RendezVousRequest' }
            examples:
              patient:
                summary: Un patient réserve
                value: { praticienId: "e9609385-19d9-4f11-8870-2be7c7ed9802", date: "2026-11-30", heure: "09:30", motif: Douleurs au dos }
              praticien:
                summary: Un praticien réserve pour un patient
                value: { praticienId: "e9609385-19d9-4f11-8870-2be7c7ed9802", patientId: "ec64eced-b845-489e-9a26-db2bd4f84c40", date: "2026-11-30", heure: "10:00", duree: 45, motif: Suivi }
      responses:
        '201':
          description: Rendez-vous créé (PLANIFIE)
          headers:
            Location: { schema: { type: string }, description: "/rendezvous/{rdvId}" }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RendezVous' }
        '400':
          description: Date/heure mal formée, durée hors bornes (10-180 min), patientId manquant (praticien)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: ValidationException, message: "date doit être une date valide au format YYYY-MM-DD", statusCode: 400, path: /rendezvous, timestamp: "2026-11-26T10:00:00Z" }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Un praticien tente de réserver dans l'agenda d'un confrère
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: ForbiddenException, message: "Un praticien ne peut créer des rendez-vous que dans son propre agenda", statusCode: 403, path: /rendezvous, timestamp: "2026-11-26T10:00:00Z" }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Conflit avec l'agenda du praticien
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                SlotAlreadyTaken:
                  summary: Créneau déjà occupé
                  value: { error: SlotAlreadyTakenException, message: "Le créneau du 2026-11-30 à 09:30 est déjà occupé", statusCode: 409, path: /rendezvous, timestamp: "2026-11-26T10:00:00Z" }
                PractitionerNotAvailable:
                  summary: Praticien EN_CONGE ou INACTIF
                  value: { error: PractitionerNotAvailableException, message: "Le praticien est EN_CONGE et ne peut pas recevoir de rendez-vous", statusCode: 409, path: /rendezvous, timestamp: "2026-11-26T10:00:00Z" }
                PractitionerUnavailable:
                  summary: Indisponibilité ponctuelle
                  value: { error: PractitionerUnavailableException, message: "Le praticien a déclaré une indisponibilité sur ce créneau", statusCode: 409, path: /rendezvous, timestamp: "2026-11-26T10:00:00Z" }
        '422':
          description: Rendez-vous dans le passé ou hors des disponibilités
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                PastDate:
                  summary: Date passée
                  value: { error: PastDateException, message: "Le rendez-vous du 2026-11-25 à 10:00 est dans le passé", statusCode: 422, path: /rendezvous, timestamp: "2026-11-26T10:00:00Z" }
                OutsideAvailability:
                  summary: Hors disponibilités
                  value: { error: OutsideAvailabilityException, message: "Le créneau 13:00 (30 min) est en dehors des disponibilités du praticien", statusCode: 422, path: /rendezvous, timestamp: "2026-11-26T10:00:00Z" }
    get:
      tags: [Rendez-vous]
      summary: Mes rendez-vous (paginés, filtrables par statut et date)
      description: Patient → ses rendez-vous ; praticien → son agenda. Tri par date puis heure.
      parameters:
        - name: statut
          in: query
          description: Un ou plusieurs statuts séparés par des virgules
          schema: { type: string }
          example: PLANIFIE,CONFIRME
        - { name: dateDebut, in: query, description: Inclus, schema: { type: string, format: date }, example: "2026-11-30" }
        - { name: dateFin, in: query, description: Inclus, schema: { type: string, format: date }, example: "2026-12-06" }
        - { $ref: '#/components/parameters/page' }
        - { $ref: '#/components/parameters/limit' }
      responses:
        '200':
          description: Page de rendez-vous
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/RendezVous' } }
        '400':
          description: Statut inconnu, date invalide, pagination invalide
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: ValidationException, message: "statut invalide : XYZ (valeurs possibles : [PLANIFIE, CONFIRME, EN_COURS, TERMINE, ANNULE, NON_VENU])", statusCode: 400, path: /rendezvous, timestamp: "2026-11-26T10:00:00Z" }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /rendezvous/{id}:
    parameters:
      - { $ref: '#/components/parameters/rdvId' }
    get:
      tags: [Rendez-vous]
      summary: Détail d'un rendez-vous (patient ou praticien concerné)
      responses:
        '200':
          description: Rendez-vous
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RendezVous' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NotParticipant' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Rendez-vous]
      summary: Confirmer, démarrer, terminer, annuler ou déclarer absent
      description: Fait évoluer le statut en respectant le cycle de vie décrit en tête de page.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StatutRdvRequest' }
            examples:
              confirmer: { summary: Confirmer, value: { statut: CONFIRME } }
              demarrer: { summary: Démarrer la consultation (praticien), value: { statut: EN_COURS } }
              terminer: { summary: Terminer la consultation (praticien), value: { statut: TERMINE } }
              annuler: { summary: Annuler, value: { statut: ANNULE } }
              absent: { summary: Patient absent (praticien), value: { statut: NON_VENU } }
      responses:
        '200':
          description: Rendez-vous mis à jour
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RendezVous' }
        '400':
          description: Statut inconnu
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: ValidationException, message: "statut invalide : FINI (CONFIRME, EN_COURS, TERMINE, ANNULE, NON_VENU)", statusCode: 400, path: /rendezvous/8a1f..., timestamp: "2026-11-26T10:00:00Z" }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Pas participant, ou action réservée au praticien
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: ForbiddenException, message: "Seul le praticien du rendez-vous peut le passer en EN_COURS", statusCode: 403, path: /rendezvous/8a1f..., timestamp: "2026-11-26T10:00:00Z" }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Transition impossible ou annulation trop tardive
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                CancellationTooLate:
                  summary: Annulation moins de 2h avant
                  value: { error: CancellationTooLateException, message: "Annulation impossible moins de 2h avant le rendez-vous (il reste 70 min)", statusCode: 409, path: /rendezvous/8a1f..., timestamp: "2026-11-26T10:00:00Z" }
                InvalidTransition:
                  summary: Transition interdite
                  value: { error: InvalidStatusTransitionException, message: "Transition PLANIFIE → TERMINE impossible", statusCode: 409, path: /rendezvous/8a1f..., timestamp: "2026-11-26T10:00:00Z" }

  /rendezvous/{id}/compte-rendu:
    parameters:
      - { $ref: '#/components/parameters/rdvId' }
    post:
      tags: [Comptes rendus]
      summary: Rédiger le compte rendu (praticien du rendez-vous)
      description: |
        Le rendez-vous doit être **TERMINE**. Le compte rendu est créé en BROUILLON,
        ou directement FINALISE si `finaliser: true`. Une ordonnance ne peut être émise qu'après finalisation.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompteRenduRequest' }
            example: { contenu: "Lombalgie commune sans signe de gravité. Repos relatif, antalgiques.", diagnostic: Lombalgie aiguë, finaliser: false }
      responses:
        '201':
          description: Compte rendu créé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompteRendu' }
        '400':
          description: Contenu de moins de 10 caractères
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: ValidationException, message: "contenu : doit contenir au moins 10 caractères", statusCode: 400, path: /rendezvous/8a1f.../compte-rendu, timestamp: "2026-11-26T10:00:00Z" }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NotRdvPraticien' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Rendez-vous non TERMINE, ou compte rendu déjà existant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                ConsultationNotFinalized:
                  summary: Rendez-vous non terminé
                  value: { error: ConsultationNotFinalizedException, message: "Le rendez-vous doit être TERMINE pour rédiger le compte rendu (statut actuel : CONFIRME)", statusCode: 409, path: /rendezvous/8a1f.../compte-rendu, timestamp: "2026-11-26T10:00:00Z" }
                Conflict:
                  summary: Déjà rédigé
                  value: { error: ConflictException, message: "Un compte rendu existe déjà pour ce rendez-vous (utilisez PUT pour le modifier)", statusCode: 409, path: /rendezvous/8a1f.../compte-rendu, timestamp: "2026-11-26T10:00:00Z" }
    put:
      tags: [Comptes rendus]
      summary: Modifier le compte rendu (tant qu'il est en BROUILLON)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompteRenduRequest' }
            example: { contenu: "Lombalgie commune sans signe de gravité. Kinésithérapie conseillée.", diagnostic: Lombalgie aiguë, finaliser: true }
      responses:
        '200':
          description: Compte rendu mis à jour
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompteRendu' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NotRdvPraticien' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/AlreadyFinalized' }
    get:
      tags: [Comptes rendus]
      summary: Consulter le compte rendu
      description: Le patient ne voit le compte rendu qu'une fois finalisé.
      responses:
        '200':
          description: Compte rendu
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompteRendu' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NotParticipant' }
        '404': { $ref: '#/components/responses/NotFound' }

  /rendezvous/{id}/compte-rendu/finalisation:
    post:
      tags: [Comptes rendus]
      summary: Finaliser le compte rendu
      description: Le compte rendu devient définitif (plus modifiable) ; l'ordonnance peut alors être émise.
      parameters:
        - { $ref: '#/components/parameters/rdvId' }
      responses:
        '200':
          description: Compte rendu finalisé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompteRendu' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NotRdvPraticien' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/AlreadyFinalized' }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }

  parameters:
    praticienId:
      name: id
      in: path
      required: true
      description: Identifiant du praticien
      schema: { type: string, format: uuid }
    rdvId:
      name: id
      in: path
      required: true
      description: Identifiant du rendez-vous
      schema: { type: string, format: uuid }
    page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 10 }

  responses:
    ValidationError:
      description: Requête invalide
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: ValidationException, message: "Corps de requête JSON invalide", statusCode: 400, path: /rendezvous, timestamp: "2026-11-26T10:00:00Z" }
    Unauthorized:
      description: Token JWT manquant, expiré ou invalide
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: UnauthorizedException, message: "Token JWT manquant ou invalide", statusCode: 401, path: /rendezvous, timestamp: "2026-11-26T10:00:00Z" }
    PraticienOnly:
      description: Action réservée aux praticiens
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: ForbiddenException, message: "Seul un praticien peut effectuer cette action", statusCode: 403, path: /praticiens/me/disponibilites, timestamp: "2026-11-26T10:00:00Z" }
    NotParticipant:
      description: L'utilisateur ne participe pas à ce rendez-vous
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: ForbiddenException, message: "Vous ne participez pas à ce rendez-vous", statusCode: 403, path: /rendezvous/8a1f..., timestamp: "2026-11-26T10:00:00Z" }
    NotRdvPraticien:
      description: L'utilisateur n'est pas le praticien du rendez-vous
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: ForbiddenException, message: "Vous n'êtes pas le praticien de ce rendez-vous", statusCode: 403, path: /rendezvous/8a1f.../compte-rendu, timestamp: "2026-11-26T10:00:00Z" }
    NotFound:
      description: Ressource introuvable
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: NotFoundException, message: "Rendez-vous 8a1f... non trouvé", statusCode: 404, path: /rendezvous/8a1f..., timestamp: "2026-11-26T10:00:00Z" }
    PractitionerNotAvailable:
      description: Praticien EN_CONGE ou INACTIF
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: PractitionerNotAvailableException, message: "Le praticien est EN_CONGE et ne peut pas recevoir de rendez-vous", statusCode: 409, path: /praticiens/x/creneaux, timestamp: "2026-11-26T10:00:00Z" }
    AlreadyFinalized:
      description: Le compte rendu est déjà finalisé
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: CompteRenduAlreadyFinalizedException, message: "Le compte rendu est finalisé et ne peut plus être modifié", statusCode: 409, path: /rendezvous/8a1f.../compte-rendu, timestamp: "2026-11-26T10:00:00Z" }

  schemas:
    Error:
      type: object
      properties:
        error: { type: string, description: Nom de l'exception métier }
        message: { type: string }
        statusCode: { type: integer }
        path: { type: string }
        timestamp: { type: string, format: date-time }
    Page:
      type: object
      properties:
        count: { type: integer, description: Nombre total d'éléments }
        page: { type: integer }
        limit: { type: integer }
    JourSemaine:
      type: string
      enum: [LUNDI, MARDI, MERCREDI, JEUDI, VENDREDI, SAMEDI, DIMANCHE]
    StatutRdv:
      type: string
      enum: [PLANIFIE, CONFIRME, EN_COURS, TERMINE, ANNULE, NON_VENU]
    DisponibilitesRequest:
      type: object
      required: [disponibilites]
      properties:
        disponibilites:
          type: array
          items:
            type: object
            required: [jourSemaine, heureDebut, heureFin]
            properties:
              jourSemaine: { $ref: '#/components/schemas/JourSemaine' }
              heureDebut: { type: string, pattern: '^\d{2}:\d{2}$', example: "09:00" }
              heureFin: { type: string, pattern: '^\d{2}:\d{2}$', example: "12:00" }
    Disponibilite:
      type: object
      properties:
        dispoId: { type: string, format: uuid }
        praticienId: { type: string, format: uuid }
        jourSemaine: { $ref: '#/components/schemas/JourSemaine' }
        heureDebut: { type: string, example: "09:00" }
        heureFin: { type: string, example: "12:00" }
        recurrente: { type: boolean, example: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    IndisponibiliteRequest:
      type: object
      required: [dateDebut, dateFin]
      properties:
        dateDebut: { type: string, example: "2026-12-01T14:00" }
        dateFin: { type: string, example: "2026-12-01T18:00" }
        motif: { type: string, example: Formation }
    Indisponibilite:
      type: object
      properties:
        indispoId: { type: string, format: uuid }
        praticienId: { type: string, format: uuid }
        dateDebut: { type: string, example: "2026-12-01T14:00" }
        dateFin: { type: string, example: "2026-12-01T18:00" }
        motif: { type: string }
        recurrente: { type: boolean, example: false }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Creneau:
      type: object
      properties:
        date: { type: string, format: date }
        heure: { type: string, example: "09:30" }
        duree: { type: integer, example: 30 }
    RendezVousRequest:
      type: object
      required: [praticienId, date, heure]
      properties:
        praticienId: { type: string, format: uuid }
        date: { type: string, format: date }
        heure: { type: string, pattern: '^\d{2}:\d{2}$' }
        duree: { type: integer, minimum: 10, maximum: 180, default: 30 }
        motif: { type: string }
        patientId: { type: string, format: uuid, description: Obligatoire si l'appelant est un praticien }
    StatutRdvRequest:
      type: object
      required: [statut]
      properties:
        statut: { type: string, enum: [CONFIRME, EN_COURS, TERMINE, ANNULE, NON_VENU] }
    RendezVous:
      type: object
      properties:
        rdvId: { type: string, format: uuid }
        praticienId: { type: string, format: uuid }
        praticienNom: { type: string }
        patientId: { type: string, format: uuid }
        patientNom: { type: string }
        date: { type: string, format: date }
        heure: { type: string }
        duree: { type: integer }
        motif: { type: string }
        statut: { $ref: '#/components/schemas/StatutRdv' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      example:
        rdvId: "8a1f2c3d-0000-4000-8000-000000000001"
        praticienId: "e9609385-19d9-4f11-8870-2be7c7ed9802"
        praticienNom: Claire Martin
        patientId: "ec64eced-b845-489e-9a26-db2bd4f84c40"
        patientNom: Alice Dupont
        date: "2026-11-30"
        heure: "09:30"
        duree: 30
        motif: Douleurs au dos
        statut: PLANIFIE
        createdAt: "2026-11-26T09:00:00Z"
        updatedAt: "2026-11-26T09:00:00Z"
    CompteRenduRequest:
      type: object
      required: [contenu]
      properties:
        contenu: { type: string, minLength: 10 }
        diagnostic: { type: string }
        finaliser: { type: boolean, default: false }
    CompteRendu:
      type: object
      properties:
        compteRenduId: { type: string, format: uuid }
        rdvId: { type: string, format: uuid }
        praticienId: { type: string, format: uuid }
        patientId: { type: string, format: uuid }
        contenu: { type: string }
        diagnostic: { type: string }
        statut: { type: string, enum: [BROUILLON, FINALISE] }
        dateFinalisation: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
