openapi: 3.0.3
info:
  title: HealthTrack API - Disponibilités & Rendez-Vous
  description: |
    API de gestion des disponibilités, indisponibilités et rendez-vous pour l'application HealthTrack.
    
    Cette API permet aux praticiens de gérer leurs créneaux de disponibilité,
    aux patients de prendre des rendez-vous, et aux deux parties de gérer leurs rendez-vous.
  version: 1.0.0
  contact:
    name: HealthTrack Team
    email: contact@healthtrack.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: https://api.healthtrack.com/disponibilites
    description: Production server
  - url: https://staging-api.healthtrack.com/disponibilites
    description: Staging server
  - url: http://localhost:3000/disponibilites
    description: Development server

tags:
  - name: Disponibilités
    description: Gestion des créneaux de disponibilité
  - name: Indisponibilités
    description: Gestion des périodes d'indisponibilité
  - name: Rendez-Vous
    description: Gestion des rendez-vous
  - name: Comptes Rendus
    description: Gestion des comptes rendus de consultation

security:
  - bearerAuth: []

paths:
  /disponibilites:
    post:
      tags:
        - Disponibilités
      summary: Créer une nouvelle disponibilité
      description: |
        Crée un nouveau créneau de disponibilité pour un praticien.
        Seuls les praticiens peuvent créer des disponibilités.
      operationId: createDisponibilite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DisponibiliteInput'
      responses:
        '201':
          description: Disponibilité créée avec succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Disponibilite'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

    get:
      tags:
        - Disponibilités
      summary: Lister les disponibilités
      description: |
        Retourne la liste des créneaux de disponibilité.
        Les patients peuvent filtrer par praticien.
        Les praticiens voient leurs propres disponibilités.
      operationId: listDisponibilites
      parameters:
        - name: praticienId
          in: query
          description: Filtrer par ID du praticien
          required: false
          schema:
            type: string
            format: uuid
        - name: jourSemaine
          in: query
          description: Filtrer par jour de la semaine
          required: false
          schema:
            type: string
            enum: [LUNDI, MARDI, MERCREDI, JEUDI, VENDREDI, SAMEDI, DIMANCHE]
        - name: dateDebut
          in: query
          description: Filtrer par date de début
          required: false
          schema:
            type: string
            format: date
        - name: dateFin
          in: query
          description: Filtrer par date de fin
          required: false
          schema:
            type: string
            format: date
        - name: recurrence
          in: query
          description: Filtrer par type de récurrence
          required: false
          schema:
            type: string
            enum: [PONCTUEL, HEBDOMADAIRE, MENSUEL, ANNUEL]
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: Liste des disponibilités
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisponibiliteList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /disponibilites/{disponibiliteId}:
    get:
      tags:
        - Disponibilités
      summary: Obtenir une disponibilité
      description: Retourne les détails d'un créneau de disponibilité
      operationId: getDisponibiliteById
      parameters:
        - $ref: '#/components/parameters/disponibiliteId'
      responses:
        '200':
          description: Détails de la disponibilité
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Disponibilite'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    patch:
      tags:
        - Disponibilités
      summary: Mettre à jour une disponibilité
      description: Met à jour un créneau de disponibilité existant
      operationId: updateDisponibilite
      parameters:
        - $ref: '#/components/parameters/disponibiliteId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DisponibiliteUpdate'
      responses:
        '200':
          description: Disponibilité mise à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Disponibilite'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags:
        - Disponibilités
      summary: Supprimer une disponibilité
      description: Supprime un créneau de disponibilité
      operationId: deleteDisponibilite
      parameters:
        - $ref: '#/components/parameters/disponibiliteId'
      responses:
        '204':
          description: Disponibilité supprimée avec succès
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /indisponibilites:
    post:
      tags:
        - Indisponibilités
      summary: Créer une nouvelle indisponibilité
      description: |
        Crée une période d'indisponibilité pour un praticien.
        Seuls les praticiens peuvent créer des indisponibilités.
      operationId: createIndisponibilite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IndisponibiliteInput'
      responses:
        '201':
          description: Indisponibilité créée avec succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Indisponibilite'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

    get:
      tags:
        - Indisponibilités
      summary: Lister les indisponibilités
      description: |
        Retourne la liste des périodes d'indisponibilité.
        Les patients peuvent filtrer par praticien.
      operationId: listIndisponibilites
      parameters:
        - name: praticienId
          in: query
          description: Filtrer par ID du praticien
          required: false
          schema:
            type: string
            format: uuid
        - name: dateDebut
          in: query
          description: Filtrer par date de début
          required: false
          schema:
            type: string
            format: date
        - name: dateFin
          in: query
          description: Filtrer par date de fin
          required: false
          schema:
            type: string
            format: date
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: Liste des indisponibilités
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndisponibiliteList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /rendezvous:
    post:
      tags:
        - Rendez-Vous
      summary: Créer un nouveau rendez-vous
      description: |
        Crée un nouveau rendez-vous avec un praticien.
        Le patient doit être authentifié.
        Le créneau doit être disponible.
      operationId: createRendezVous
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RendezVousInput'
      responses:
        '201':
          description: Rendez-vous créé avec succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RendezVous'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Conflit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          examples:
            slotNotAvailable:
              value:
                error: "SlotNotAvailableException"
                message: "Le créneau sélectionné n'est pas disponible"
                statusCode: 409
            patientConflict:
              value:
                error: "PatientAlreadyHasAppointmentException"
                message: "Vous avez déjà un rendez-vous à ce créneau"
                statusCode: 409
            praticienNotAvailable:
              value:
                error: "PraticienNotAvailableException"
                message: "Le praticien n'est pas disponible à ce créneau"
                statusCode: 409
        '500':
          $ref: '#/components/responses/InternalServerError'

    get:
      tags:
        - Rendez-Vous
      summary: Lister les rendez-vous
      description: |
        Retourne la liste des rendez-vous.
        Les patients voient leurs propres rendez-vous.
        Les praticiens voient tous les rendez-vous.
      operationId: listRendezVous
      parameters:
        - name: patientId
          in: query
          description: Filtrer par ID du patient
          required: false
          schema:
            type: string
            format: uuid
        - name: praticienId
          in: query
          description: Filtrer par ID du praticien
          required: false
          schema:
            type: string
            format: uuid
        - name: statut
          in: query
          description: Filtrer par statut
          required: false
          schema:
            type: string
            enum: [CONFIRME, ANNULE, TERMINE, NO_SHOW]
        - name: dateDebut
          in: query
          description: Filtrer par date de début
          required: false
          schema:
            type: string
            format: date
        - name: dateFin
          in: query
          description: Filtrer par date de fin
          required: false
          schema:
            type: string
            format: date
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: Liste des rendez-vous
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RendezVousList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /rendezvous/{rendezVousId}:
    get:
      tags:
        - Rendez-Vous
      summary: Obtenir un rendez-vous
      description: Retourne les détails d'un rendez-vous
      operationId: getRendezVousById
      parameters:
        - $ref: '#/components/parameters/rendezVousId'
      responses:
        '200':
          description: Détails du rendez-vous
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RendezVousAvecDetails'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /patients/{patientId}/rendezvous:
    get:
      tags:
        - Rendez-Vous
      summary: Lister les rendez-vous d'un patient
      description: Retourne la liste des rendez-vous d'un patient spécifique
      operationId: listRendezVousByPatient
      parameters:
        - $ref: '#/components/parameters/patientId'
        - name: statut
          in: query
          description: Filtrer par statut
          required: false
          schema:
            type: string
            enum: [CONFIRME, ANNULE, TERMINE, NO_SHOW]
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: Liste des rendez-vous du patient
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RendezVous'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /rendezvous/{rendezVousId}/annuler:
    patch:
      tags:
        - Rendez-Vous
      summary: Annuler un rendez-vous
      description: |
        Annule un rendez-vous existant.
        Un patient peut annuler ses propres rendez-vous.
        Un praticien peut annuler les rendez-vous de ses patients.
      operationId: annulerRendezVous
      parameters:
        - $ref: '#/components/parameters/rendezVousId'
      responses:
        '200':
          description: Rendez-vous annulé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RendezVous'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Conflit - Rendez-vous déjà commencé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          example:
            error: "AppointmentAlreadyStartedException"
            message: "Le rendez-vous a déjà commencé et ne peut plus être annulé"
            statusCode: 409
        '500':
          $ref: '#/components/responses/InternalServerError'

  /rendezvous/{rendezVousId}/finaliser:
    post:
      tags:
        - Rendez-Vous
        - Comptes Rendus
      summary: Finaliser un rendez-vous et créer un compte rendu
      description: |
        Finalise un rendez-vous et crée un compte rendu de consultation.
        Seul le praticien du rendez-vous peut le finaliser.
      operationId: finaliserRendezVous
      parameters:
        - $ref: '#/components/parameters/rendezVousId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompteRenduInput'
      responses:
        '201':
          description: Compte rendu créé avec succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompteRendu'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Conflit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          examples:
            alreadyTerminated:
              value:
                error: "RendezVousAlreadyTerminatedException"
                message: "Le rendez-vous est déjà terminé"
                statusCode: 409
        '500':
          $ref: '#/components/responses/InternalServerError'

  /rendezvous/{rendezVousId}/compte-rendu/finaliser:
    post:
      tags:
        - Comptes Rendus
      summary: Finaliser un compte rendu
      description: |
        Finalise un compte rendu de consultation.
        Seul le praticien peut finaliser un compte rendu.
      operationId: finaliserCompteRendu
      parameters:
        - $ref: '#/components/parameters/rendezVousId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompteRenduFinalisationInput'
      responses:
        '200':
          description: Compte rendu finalisé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompteRendu'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Conflit - Compte rendu déjà finalisé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          example:
            error: "ConsultationAlreadyFinalizedException"
            message: "Le compte rendu est déjà finalisé"
            statusCode: 409
        '500':
          $ref: '#/components/responses/InternalServerError'

  /comptes-rendus/{compteRenduId}:
    get:
      tags:
        - Comptes Rendus
      summary: Obtenir un compte rendu
      description: Retourne les détails d'un compte rendu de consultation
      operationId: getCompteRenduById
      parameters:
        - name: compteRenduId
          in: path
          required: true
          description: ID du compte rendu
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Détails du compte rendu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompteRendu'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /patients/{patientId}/comptes-rendus:
    get:
      tags:
        - Comptes Rendus
      summary: Lister les comptes rendus d'un patient
      description: Retourne la liste des comptes rendus d'un patient
      operationId: listComptesRendusByPatient
      parameters:
        - $ref: '#/components/parameters/patientId'
        - name: statut
          in: query
          description: Filtrer par statut
          required: false
          schema:
            type: string
            enum: [EN_COURS, FINALISE]
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: Liste des comptes rendus
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CompteRendu'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token JWT pour l'authentification

  schemas:
    Disponibilite:
      type: object
      properties:
        disponibiliteId:
          type: string
          format: uuid
          example: "disponibilite-uuid-1234"
        praticienId:
          type: string
          format: uuid
          example: "praticien-uuid-1234"
        dateDebut:
          type: string
          format: date-time
          example: "2023-12-01T09:00:00Z"
          description: Date et heure de début du créneau
        dateFin:
          type: string
          format: date-time
          example: "2023-12-01T17:00:00Z"
          description: Date et heure de fin du créneau
        jourSemaine:
          type: string
          enum: [LUNDI, MARDI, MERCREDI, JEUDI, VENDREDI, SAMEDI, DIMANCHE]
          example: "LUNDI"
          description: Jour de la semaine (pour les récurrences)
        recurrence:
          type: string
          enum: [PONCTUEL, HEBDOMADAIRE, MENSUEL, ANNUEL]
          example: "HEBDOMADAIRE"
          description: Type de récurrence
        statut:
          type: string
          enum: [ACTIVE, DESACTIVE]
          example: "ACTIVE"
        createdAt:
          type: string
          format: date-time
          example: "2023-11-25T10:00:00Z"
        updatedAt:
          type: string
          format: date-time
          example: "2023-11-25T10:00:00Z"

    DisponibiliteInput:
      type: object
      required:
        - dateDebut
        - dateFin
      properties:
        dateDebut:
          type: string
          format: date-time
          example: "2023-12-01T09:00:00Z"
        dateFin:
          type: string
          format: date-time
          example: "2023-12-01T17:00:00Z"
        jourSemaine:
          type: string
          enum: [LUNDI, MARDI, MERCREDI, JEUDI, VENDREDI, SAMEDI, DIMANCHE]
          example: "LUNDI"
        recurrence:
          type: string
          enum: [PONCTUEL, HEBDOMADAIRE, MENSUEL, ANNUEL]
          default: PONCTUEL
          example: "HEBDOMADAIRE"

    DisponibiliteUpdate:
      type: object
      properties:
        dateDebut:
          type: string
          format: date-time
          example: "2023-12-01T09:00:00Z"
        dateFin:
          type: string
          format: date-time
          example: "2023-12-01T17:00:00Z"
        jourSemaine:
          type: string
          enum: [LUNDI, MARDI, MERCREDI, JEUDI, VENDREDI, SAMEDI, DIMANCHE]
        recurrence:
          type: string
          enum: [PONCTUEL, HEBDOMADAIRE, MENSUEL, ANNUEL]
        statut:
          type: string
          enum: [ACTIVE, DESACTIVE]

    DisponibiliteList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Disponibilite'
        count:
          type: integer
          example: 10
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 10

    Indisponibilite:
      type: object
      properties:
        indisponibiliteId:
          type: string
          format: uuid
          example: "indisponibilite-uuid-1234"
        praticienId:
          type: string
          format: uuid
          example: "praticien-uuid-1234"
        dateDebut:
          type: string
          format: date-time
          example: "2023-12-25T00:00:00Z"
        dateFin:
          type: string
          format: date-time
          example: "2023-12-26T00:00:00Z"
        raison:
          type: string
          maxLength: 500
          example: "Congé de Noël"
        createdAt:
          type: string
          format: date-time
          example: "2023-11-25T10:00:00Z"

    IndisponibiliteInput:
      type: object
      required:
        - dateDebut
        - dateFin
        - raison
      properties:
        dateDebut:
          type: string
          format: date-time
          example: "2023-12-25T00:00:00Z"
        dateFin:
          type: string
          format: date-time
          example: "2023-12-26T00:00:00Z"
        raison:
          type: string
          maxLength: 500
          example: "Congé de Noël"

    IndisponibiliteList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Indisponibilite'
        count:
          type: integer
          example: 5
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 10

    RendezVous:
      type: object
      properties:
        rendezVousId:
          type: string
          format: uuid
          example: "rendez-vous-uuid-1234"
        patientId:
          type: string
          format: uuid
          example: "patient-uuid-1234"
        praticienId:
          type: string
          format: uuid
          example: "praticien-uuid-1234"
        dateHeure:
          type: string
          format: date-time
          example: "2023-12-15T10:00:00Z"
        statut:
          type: string
          enum: [CONFIRME, ANNULE, TERMINE, NO_SHOW]
          example: "CONFIRME"
        motif:
          type: string
          maxLength: 500
          example: "Consultation de routine"
        duree:
          type: integer
          example: 30
          description: Durée en minutes
        createdAt:
          type: string
          format: date-time
          example: "2023-11-25T10:00:00Z"
        updatedAt:
          type: string
          format: date-time
          example: "2023-11-25T10:00:00Z"

    RendezVousInput:
      type: object
      required:
        - praticienId
        - dateHeure
      properties:
        praticienId:
          type: string
          format: uuid
          example: "praticien-uuid-1234"
        dateHeure:
          type: string
          format: date-time
          example: "2023-12-15T10:00:00Z"
        motif:
          type: string
          maxLength: 500
          example: "Consultation de routine"

    RendezVousList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RendezVous'
        count:
          type: integer
          example: 10
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 10

    RendezVousAvecDetails:
      type: object
      allOf:
        - $ref: '#/components/schemas/RendezVous'
        - type: object
          properties:
            praticien:
              type: object
              properties:
                userId:
                  type: string
                  format: uuid
                nom:
                  type: string
                  example: "Dr. Martin"
                specialite:
                  type: string
                  example: "Médecine Générale"
            patient:
              type: object
              properties:
                userId:
                  type: string
                  format: uuid
                nom:
                  type: string
                  example: "Jean Dupont"

    CompteRendu:
      type: object
      properties:
        compteRenduId:
          type: string
          format: uuid
          example: "compte-rendu-uuid-1234"
        rendezVousId:
          type: string
          format: uuid
          example: "rendez-vous-uuid-1234"
        patientId:
          type: string
          format: uuid
          example: "patient-uuid-1234"
        praticienId:
          type: string
          format: uuid
          example: "praticien-uuid-1234"
        diagnostic:
          type: string
          maxLength: 2000
          example: "Diagnostic détaillé du patient"
        traitement:
          type: string
          maxLength: 2000
          example: "Traitement prescrit"
        resume:
          type: string
          maxLength: 500
          example: "Résumé de la consultation"
        statut:
          type: string
          enum: [EN_COURS, FINALISE]
          example: "EN_COURS"
        dateFinalisation:
          type: string
          format: date-time
          example: "2023-11-25T10:00:00Z"
        createdAt:
          type: string
          format: date-time
          example: "2023-11-25T10:00:00Z"
        updatedAt:
          type: string
          format: date-time
          example: "2023-11-25T10:00:00Z"

    CompteRenduInput:
      type: object
      required:
        - diagnostic
      properties:
        diagnostic:
          type: string
          maxLength: 2000
          example: "Diagnostic détaillé"
        traitement:
          type: string
          maxLength: 2000
          example: "Traitement prescrit"
        resume:
          type: string
          maxLength: 500
          example: "Résumé de la consultation"

    CompteRenduFinalisationInput:
      type: object
      required:
        - resume
      properties:
        resume:
          type: string
          maxLength: 500
          example: "Résumé final de la consultation"

    Error:
      type: object
      required:
        - error
        - message
        - statusCode
      properties:
        error:
          type: string
          example: "NotFound"
        message:
          type: string
          example: "Ressource non trouvée"
        statusCode:
          type: integer
          example: 404

  responses:
    BadRequest:
      description: Requête invalide
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Unauthorized:
      description: Non autorisé
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Forbidden:
      description: Accès interdit
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    NotFound:
      description: Ressource non trouvée
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    InternalServerError:
      description: Erreur interne du serveur
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  parameters:
    disponibiliteId:
      name: disponibiliteId
      in: path
      required: true
      description: ID de la disponibilité
      schema:
        type: string
        format: uuid

    rendezVousId:
      name: rendezVousId
      in: path
      required: true
      description: ID du rendez-vous
      schema:
        type: string
        format: uuid

    patientId:
      name: patientId
      in: path
      required: true
      description: ID du patient
      schema:
        type: string
        format: uuid

    page:
      name: page
      in: query
      description: Numéro de la page
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1

    limit:
      name: limit
      in: query
      description: Nombre d'éléments par page
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
