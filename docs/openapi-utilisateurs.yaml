openapi: 3.0.3
info:
  title: HealthTrack — API Utilisateurs
  version: 2.0.0
  description: |
    Inscription, connexion (JWT), profils, médecin traitant et recherche de praticiens.

    **Authentification** : `POST /auth/login` (ou `/auth/register`) renvoie un `token` JWT signé (HS256)
    contenant l'identifiant (`sub`), le `type` (PATIENT / PRATICIEN) et le nom. Cliquez sur **Authorize**
    et collez ce token : il est accepté par les 4 APIs HealthTrack.

    **Erreurs** : toutes les erreurs ont le même format `{ error, message, statusCode, path, timestamp }`,
    où `error` est le nom de l'exception métier.

    Comptes de démonstration (mot de passe `Demo1234!`) : `alice.dupont@example.com` (patient),
    `dr.martin@healthtrack.fr` (généraliste), `dr.leroy@healthtrack.fr` (généraliste EN_CONGE).

servers:
  - url: /
    description: Même hôte que cette page (API Gateway sur AWS, localhost:8081 en local)

tags:
  - name: Authentification
  - name: Profil
  - name: Patients
  - name: Praticiens

security:
  - bearerAuth: []

paths:
  /auth/register:
    post:
      tags: [Authentification]
      summary: Inscription d'un patient ou d'un praticien
      description: |
        Les champs `specialite` et `rpps` sont obligatoires pour un praticien (créé au statut ACTIF),
        `dateNaissance` et `nss` pour un patient. L'email est normalisé en minuscules.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
            examples:
              patient:
                summary: Patient
                value: { email: jeanne.petit@example.com, password: "Secret123!", type: PATIENT, firstName: Jeanne, lastName: Petit, dateNaissance: "1992-03-14", nss: "292037512345678" }
              praticien:
                summary: Praticien
                value: { email: dr.roux@healthtrack.fr, password: "Secret123!", type: PRATICIEN, firstName: Paul, lastName: Roux, specialite: GENERALISTE, rpps: "10101010101" }
      responses:
        '201':
          description: Compte créé, l'utilisateur est connecté
          headers:
            Location: { schema: { type: string }, description: "/utilisateurs/{userId}" }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400':
          description: Champ manquant ou invalide (type, spécialité hors liste, date de naissance...)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: ValidationException, message: "specialite invalide (valeurs possibles : [GENERALISTE, CARDIOLOGUE, DERMATOLOGUE, PEDIATRE, AUTRE])", statusCode: 400, path: /auth/register, timestamp: "2026-11-26T10:00:00Z" }
        '409':
          description: Email déjà utilisé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: EmailAlreadyUsedException, message: "Un utilisateur avec l'email alice.dupont@example.com existe déjà", statusCode: 409, path: /auth/register, timestamp: "2026-11-26T10:00:00Z" }

  /auth/login:
    post:
      tags: [Authentification]
      summary: Connexion
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
            example: { email: alice.dupont@example.com, password: "Demo1234!" }
      responses:
        '200':
          description: Connexion réussie
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401':
          description: Email ou mot de passe incorrect
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: InvalidCredentialsException, message: "Email ou mot de passe incorrect", statusCode: 401, path: /auth/login, timestamp: "2026-11-26T10:00:00Z" }

  /utilisateurs/me:
    get:
      tags: [Profil]
      summary: Mon profil
      responses:
        '200':
          description: Profil de l'utilisateur connecté
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [Profil]
      summary: Modifier mon profil
      description: |
        Modification partielle. Un patient peut modifier `firstName`, `lastName`, `dateNaissance`, `nss` ;
        un praticien `firstName`, `lastName`, `specialite`, `rpps`.
        Le statut d'un praticien se modifie via `PATCH /praticiens/me/statut`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProfileRequest' }
            example: { firstName: Alice, lastName: Dupont-Martin }
      responses:
        '200':
          description: Profil mis à jour
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400':
          description: Champ non modifiable pour ce type de compte ou valeur invalide
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: ValidationException, message: "Le statut se modifie via PATCH /praticiens/me/statut", statusCode: 400, path: /utilisateurs/me, timestamp: "2026-11-26T10:00:00Z" }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /utilisateurs/{id}:
    get:
      tags: [Profil]
      summary: Profil d'un utilisateur
      description: Un praticien est visible par tous ; un patient n'est visible que par les praticiens (et par lui-même).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Profil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Un patient tente de consulter le profil d'un autre patient
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: ForbiddenException, message: "Seul un praticien peut consulter le profil d'un patient", statusCode: 403, path: /utilisateurs/0b6e..., timestamp: "2026-11-26T10:00:00Z" }
        '404': { $ref: '#/components/responses/NotFound' }

  /patients/me/medecin-traitant:
    put:
      tags: [Patients]
      summary: Désigner ou modifier mon médecin traitant
      description: |
        Réservé aux patients. Le praticien désigné doit être **GENERALISTE** et ne pas être **INACTIF**
        (un médecin EN_CONGE reste désignable).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MedecinTraitantRequest' }
            example: { medecinTraitantId: "e9609385-19d9-4f11-8870-2be7c7ed9802" }
      responses:
        '200':
          description: Médecin traitant enregistré (profil du patient renvoyé)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: L'utilisateur connecté n'est pas un patient
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: ForbiddenException, message: "Seul un patient peut désigner son médecin traitant", statusCode: 403, path: /patients/me/medecin-traitant, timestamp: "2026-11-26T10:00:00Z" }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Le praticien est INACTIF
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: PractitionerNotAvailableException, message: "Le praticien est INACTIF et ne peut pas être désigné médecin traitant", statusCode: 409, path: /patients/me/medecin-traitant, timestamp: "2026-11-26T10:00:00Z" }
        '422':
          description: Le praticien n'est pas généraliste
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: InvalidSpecialityException, message: "Le médecin traitant doit être GENERALISTE (spécialité actuelle : CARDIOLOGUE)", statusCode: 422, path: /patients/me/medecin-traitant, timestamp: "2026-11-26T10:00:00Z" }

  /praticiens/me/statut:
    patch:
      tags: [Praticiens]
      summary: Passer en ACTIF, EN_CONGE ou INACTIF
      description: Réservé aux praticiens. Un praticien EN_CONGE ou INACTIF ne peut plus recevoir de rendez-vous.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StatutRequest' }
            example: { statut: EN_CONGE }
      responses:
        '200':
          description: Statut mis à jour
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400':
          description: Statut inconnu
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: ValidationException, message: "statut invalide (valeurs possibles : [ACTIF, EN_CONGE, INACTIF])", statusCode: 400, path: /praticiens/me/statut, timestamp: "2026-11-26T10:00:00Z" }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: L'utilisateur connecté n'est pas un praticien
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: ForbiddenException, message: "Seul un praticien peut modifier son statut", statusCode: 403, path: /praticiens/me/statut, timestamp: "2026-11-26T10:00:00Z" }

  /praticiens:
    get:
      tags: [Praticiens]
      summary: Rechercher des praticiens (paginé, filtrable)
      parameters:
        - { name: specialite, in: query, schema: { $ref: '#/components/schemas/Specialite' } }
        - { name: statut, in: query, schema: { $ref: '#/components/schemas/StatutPraticien' } }
        - { $ref: '#/components/parameters/page' }
        - { $ref: '#/components/parameters/limit' }
      responses:
        '200':
          description: Page de praticiens triés par nom
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/User' } }
              example:
                items:
                  - { userId: "e9609385-19d9-4f11-8870-2be7c7ed9802", email: dr.martin@healthtrack.fr, type: PRATICIEN, name: Claire Martin, firstName: Claire, lastName: Martin, specialite: GENERALISTE, rpps: "10000000001", statut: ACTIF, createdAt: "2026-11-25T21:00:00Z", updatedAt: "2026-11-25T21:00:00Z" }
                count: 3
                page: 1
                limit: 10
        '400':
          description: Filtre ou pagination invalide
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: ValidationException, message: "limit doit être compris entre 1 et 100", statusCode: 400, path: /praticiens, timestamp: "2026-11-26T10:00:00Z" }
        '401': { $ref: '#/components/responses/Unauthorized' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 10 }

  responses:
    ValidationError:
      description: Requête invalide
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: ValidationException, message: "email : must be a well-formed email address", statusCode: 400, path: /auth/login, timestamp: "2026-11-26T10:00:00Z" }
    Unauthorized:
      description: Token JWT manquant, expiré ou invalide
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: UnauthorizedException, message: "Token JWT manquant ou invalide", statusCode: 401, path: /utilisateurs/me, timestamp: "2026-11-26T10:00:00Z" }
    NotFound:
      description: Utilisateur ou praticien introuvable
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: NotFoundException, message: "Praticien 1234 non trouvé", statusCode: 404, path: /patients/me/medecin-traitant, timestamp: "2026-11-26T10:00:00Z" }

  schemas:
    Error:
      type: object
      properties:
        error: { type: string, description: Nom de l'exception métier, example: EmailAlreadyUsedException }
        message: { type: string }
        statusCode: { type: integer }
        path: { type: string }
        timestamp: { type: string, format: date-time }
    Page:
      type: object
      properties:
        count: { type: integer, description: Nombre total d'éléments (toutes pages confondues) }
        page: { type: integer }
        limit: { type: integer }
    Specialite:
      type: string
      enum: [GENERALISTE, CARDIOLOGUE, DERMATOLOGUE, PEDIATRE, AUTRE]
    StatutPraticien:
      type: string
      enum: [ACTIF, EN_CONGE, INACTIF]
    User:
      type: object
      properties:
        userId: { type: string, format: uuid }
        email: { type: string, format: email }
        type: { type: string, enum: [PATIENT, PRATICIEN] }
        name: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        specialite: { allOf: [{ $ref: '#/components/schemas/Specialite' }], nullable: true, description: Praticien uniquement }
        rpps: { type: string, nullable: true, description: Praticien uniquement }
        statut: { allOf: [{ $ref: '#/components/schemas/StatutPraticien' }], nullable: true, description: Praticien uniquement }
        dateNaissance: { type: string, format: date, nullable: true, description: Patient uniquement }
        nss: { type: string, nullable: true, description: Patient uniquement }
        medecinTraitantId: { type: string, nullable: true, description: Patient uniquement }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      example:
        userId: "ec64eced-b845-489e-9a26-db2bd4f84c40"
        email: alice.dupont@example.com
        type: PATIENT
        name: Alice Dupont
        firstName: Alice
        lastName: Dupont
        dateNaissance: "1990-04-12"
        nss: "2900475012345"
        medecinTraitantId: "e9609385-19d9-4f11-8870-2be7c7ed9802"
        createdAt: "2026-11-25T21:00:00Z"
        updatedAt: "2026-11-26T09:12:00Z"
    AuthResponse:
      type: object
      properties:
        user: { $ref: '#/components/schemas/User' }
        token: { type: string, description: JWT à envoyer dans l'en-tête Authorization, example: "eyJhbGciOiJIUzI1NiJ9..." }
    RegisterRequest:
      type: object
      required: [email, password, type, firstName, lastName]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
        type: { type: string, enum: [PATIENT, PRATICIEN] }
        firstName: { type: string }
        lastName: { type: string }
        specialite: { $ref: '#/components/schemas/Specialite' }
        rpps: { type: string }
        dateNaissance: { type: string, format: date }
        nss: { type: string }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    UpdateProfileRequest:
      type: object
      properties:
        firstName: { type: string }
        lastName: { type: string }
        dateNaissance: { type: string, format: date }
        nss: { type: string }
        specialite: { $ref: '#/components/schemas/Specialite' }
        rpps: { type: string }
    MedecinTraitantRequest:
      type: object
      required: [medecinTraitantId]
      properties:
        medecinTraitantId: { type: string, format: uuid }
    StatutRequest:
      type: object
      required: [statut]
      properties:
        statut: { $ref: '#/components/schemas/StatutPraticien' }
